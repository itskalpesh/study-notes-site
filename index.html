<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta name="description" content="A documentation-style site generated automatically from an Obsidian Markdown vault." />

<link rel="manifest" href="manifest.json" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />

</head>
<body>

<a class="skip-link" href="#main-content">Skip to content</a>

<div class="progress-bar" id="progressBar" aria-hidden="true"></div>

<header class="topnav">
  <div class="topnav-inner">
    <button id="menuToggle" class="icon-btn mobile-only" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <a href="#/" class="brand" aria-label="Study Notes home">
      <svg class="brand-mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="currentColor" class="brand-mark-bg"/>
        <path d="M7 9c4-2 7-2 9 0v15c-2-2-5-2-9 0V9Z" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M25 9c-4-2-7-2-9 0v15c2-2 5-2 9 0V9Z" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
      <span class="brand-text">Study Notes</span>
    </a>

    <nav class="top-nav-links" aria-label="Main Navigation">
      <a href="#/" class="top-nav-link" id="navHome">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Notes</span>
      </a>
      <a href="#/quiz" class="top-nav-link" id="navQuiz">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Quizzes</span>
      </a>
      <a href="#/flashcards" class="top-nav-link" id="navFlashcards">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 3H8"/></svg>
        <span>Flashcards</span>
      </a>
      <a href="#/chat" class="top-nav-link" id="navChat">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8"/><path d="M8 13h6"/></svg>
        <span>Ask AI</span>
      </a>
    </nav>

    <button id="searchTrigger" class="search-trigger" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span class="search-trigger-label">Search notes…</span>
      <kbd class="kbd-hint">Ctrl K</kbd>
    </button>

    <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

  <aside id="sidebar" class="sidebar" aria-label="Notes navigation">
    <div class="sidebar-filter-wrap">
      <svg class="sidebar-filter-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="sidebarFilter" type="text" class="sidebar-filter-input" placeholder="Quick filter notes…" aria-label="Filter notes tree" autocomplete="off" spellcheck="false" />
      <button id="sidebarFilterClear" class="sidebar-filter-clear" aria-label="Clear filter" hidden>&times;</button>
    </div>
    <div class="sidebar-scroll">
      <nav id="sidebarTree" class="sidebar-tree" aria-label="Subjects">
        <div class="sidebar-loading">Loading notes…</div>
      </nav>
    </div>
  </aside>

  <main id="main-content" class="content" tabindex="-1">
    <div id="contentInner" class="content-inner"></div>
  </main>

  <aside id="tocRail" class="toc-rail" aria-label="On this page" hidden>
    <p class="toc-label">On this page</p>
    <nav id="tocNav"></nav>
  </aside>
</div>

<button id="scrollTopBtn" class="scroll-top-btn" aria-label="Scroll to top">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 11l6-6 6 6"/></svg>
</button>

<div id="searchModal" class="search-modal" role="dialog" aria-modal="true" aria-label="Search notes" hidden>
  <div class="search-modal-backdrop" id="searchBackdrop"></div>
  <div class="search-modal-panel">
    <div class="search-input-row">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Search subjects, notes, content…" autocomplete="off" spellcheck="false" />
      <kbd class="kbd-hint">Esc</kbd>
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.8/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<!-- KaTeX Math JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<!-- Mermaid Diagrams JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>
<script src="script.js" defer></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
